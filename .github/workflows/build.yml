name: Build Chat Revo
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build ChatRevo.slnx -c Release
      - run: dotnet test ChatRevo.slnx -c Release --no-build
      - name: Package
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw '태그와 프로젝트 버전이 다릅니다.' }
          ./scripts/package.ps1 -Version $version -RepositoryUrl "https://github.com/$env:REPOSITORY"
          Get-ChildItem artifacts/releases -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/releases/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ChatRevo-win-x64
          path: artifacts/releases/*
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ChatRevo-win-x64
          path: release
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          gh release create "$TAG" release/* --draft --verify-tag --title "Chat Revo $TAG" --notes-file "$notes"
